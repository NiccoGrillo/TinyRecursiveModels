name: Decision stability checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-experiments.txt
      - run: python -m pytest -q
      - run: >-
          python -m experiments.decision_stability.run --smoke
          --out runs/ci-smoke --steps 8 --fork-steps 2 4
          --horizon 4 --targeted --probe-horizon 2
      - run: bash -n scripts/run_clock_study.sh
